  <text x="328" y="234" font-family="monospace" font-size="9" fill="#4a3f2f" text-anchor="end">14 / 4,820</text>

  <text x="72" y="252" font-family="monospace" font-size="9" fill="#4a3f2f">usr_1042</text>
