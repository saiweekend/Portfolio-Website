<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PulseBoard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/web-vitals/3.5.2/web-vitals.iife.js"></script>

<style>
  /* ---------------------------------------------------------------------
     Tokens
     Palette: cool blue-grey neutral + a technical indigo accent, kept
     deliberately separate from status colors (good/warning/critical),
     which are reserved for state and never reused as decoration.
     Type: Sora for headings, Work Sans for UI copy, JetBrains Mono for
     every tabular value — amounts, ids, timestamps, latency — a nod to
     this being a tool built for engineers, not a consumer surface.
  --------------------------------------------------------------------- */
  :root {
    --bg: #f2f4f8;
    --surface: #ffffff;
    --surface-2: #e7ebf2;
    --text: #12151c;
    --text-muted: #5b6472;
    --accent: #2a5df0;
    --accent-strong: #1d46c4;
    --on-accent: #f5f7ff;
    --good: #12805a;
    --good-bg: #e3f5ec;
    --warning: #9a6205;
    --warning-bg: #fbf0da;
    --critical: #c23b2c;
    --critical-bg: #fbeae7;
    --border: #dee3ec;
    --chart-grid: #e3e7ee;
    --chart-axis: #8994a6;
    --shadow: 0 18px 40px -24px rgba(18, 21, 28, 0.35);
    --radius: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #0b0e14;
      --surface: #12161f;
      --surface-2: #1a2030;
      --text: #e9edf5;
      --text-muted: #8992a6;
      --accent: #6d92ff;
      --accent-strong: #93aeff;
      --on-accent: #08122c;
      --good: #4fd39a;
      --good-bg: #103326;
      --warning: #e7b65a;
      --warning-bg: #3a2c10;
      --critical: #f18a76;
      --critical-bg: #3a1c17;
      --border: #232a3a;
      --chart-grid: #232a3a;
      --chart-axis: #6c7690;
      --shadow: 0 18px 40px -20px rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme='dark'] {
    --bg: #0b0e14;
    --surface: #12161f;
    --surface-2: #1a2030;
    --text: #e9edf5;
    --text-muted: #8992a6;
    --accent: #6d92ff;
    --accent-strong: #93aeff;
    --on-accent: #08122c;
    --good: #4fd39a;
    --good-bg: #103326;
    --warning: #e7b65a;
    --warning-bg: #3a2c10;
    --critical: #f18a76;
    --critical-bg: #3a1c17;
    --border: #232a3a;
    --chart-grid: #232a3a;
    --chart-axis: #6c7690;
    --shadow: 0 18px 40px -20px rgba(0, 0, 0, 0.6);
  }

  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono {
    font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;
    font-variant-numeric: tabular-nums;
  }
  h1,
  h2,
  h3 {
    font-family: 'Sora', ui-sans-serif, system-ui, sans-serif;
    text-wrap: balance;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 36px 24px 70px;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 6px;
  }
  .top h1 {
    font-size: clamp(1.5rem, 2.2vw, 1.9rem);
    color: var(--accent-strong);
  }
  .top .tagline {
    color: var(--text-muted);
    font-size: 0.92rem;
    margin-top: 4px;
  }
  .top-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.76rem;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-muted);
  }
  .pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--text-muted);
  }
  .pill.live {
    background: var(--good-bg);
    color: var(--good);
  }
  .pill.live .dot {
    background: var(--good);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .pill.down .dot {
    background: var(--warning);
  }
  @keyframes pulse {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.35;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .pill.live .dot {
      animation: none;
    }
  }

  button.link-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font: inherit;
    font-size: 0.76rem;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  button.link-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  .banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--critical-bg);
    color: var(--critical);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin: 18px 0 0;
    font-size: 0.85rem;
  }
  .banner button {
    margin-left: auto;
    background: none;
    border: none;
    color: inherit;
    font-size: 1.1rem;
    cursor: pointer;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    margin: 18px 0;
  }
  @media (max-width: 900px) {
    .metric-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }
  @media (max-width: 520px) {
    .metric-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .tile .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }
  .tile .value {
    font-size: 1.25rem;
    font-weight: 600;
  }
  .tile.good .value {
    color: var(--good);
  }
  .tile.warning .value {
    color: var(--warning);
  }
  .tile.critical .value {
    color: var(--critical);
  }

  .panel-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 14px;
    margin-bottom: 16px;
  }
  @media (max-width: 820px) {
    .panel-grid {
      grid-template-columns: 1fr;
    }
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .card-head h3 {
    font-size: 0.92rem;
  }
  .hint {
    font-size: 0.7rem;
    color: var(--text-muted);
  }

  .vitals-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .vitals-list li {
    display: grid;
    grid-template-columns: 46px 60px 1fr;
    gap: 8px;
    align-items: center;
    font-size: 0.8rem;
  }
  .vitals-list .k {
    font-weight: 700;
  }
  .vitals-list .v {
    font-weight: 600;
  }
  .vitals-list .n {
    color: var(--text-muted);
    font-size: 0.72rem;
  }
  .vitals-list li.good .v {
    color: var(--good);
  }
  .vitals-list li.needs-improvement .v {
    color: var(--warning);
  }
  .vitals-list li.poor .v {
    color: var(--critical);
  }

  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px 4px;
  }
  .filter-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 10px;
  }
  .filter-row input {
    flex: 1;
    min-width: 180px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
  }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
    font-size: 0.74rem;
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
    text-transform: capitalize;
  }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .metric-strip {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--text-muted);
    background: var(--surface-2);
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 8px;
  }
  .metric-strip strong {
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
  }

  .viewport {
    height: 360px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .row {
    display: grid;
    grid-template-columns: 78px 1.3fr 1fr 1fr 92px 70px;
    gap: 8px;
    align-items: center;
    padding: 0 10px;
    height: 40px;
    border-bottom: 1px solid var(--border);
    font-size: 0.78rem;
  }
  .row.head {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .cell {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status {
    justify-self: start;
    font-size: 0.64rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 999px;
  }
  .status.completed {
    background: var(--good-bg);
    color: var(--good);
  }
  .status.flagged {
    background: var(--warning-bg);
    color: var(--warning);
  }
  .status.failed {
    background: var(--critical-bg);
    color: var(--critical);
  }

  .notes {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 820px) {
    .notes {
      grid-template-columns: 1fr;
    }
  }
  .notes .card p {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.55;
    margin: 0;
  }
  .notes .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent-strong);
    display: block;
    margin-bottom: 6px;
  }

  footer.note {
    margin-top: 26px;
    font-size: 0.78rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  .chart-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 9px;
    font-size: 0.72rem;
    box-shadow: var(--shadow);
    transform: translate(-50%, -110%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
  const h = React.createElement;
  const { useState, useEffect, useRef, useMemo, useCallback, memo } = React;

  const yen = new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', maximumFractionDigits: 0 });
  const formatYen = (v) => yen.format(v);
  const formatCompactYen = (v) =>
    v >= 1_000_000 ? `¥${(v / 1_000_000).toFixed(1)}M` : v >= 1_000 ? `¥${(v / 1_000).toFixed(1)}K` : `¥${v}`;
  const formatRelative = (ts, now = Date.now()) => {
    const s = Math.max(0, Math.round((now - ts) / 1000));
    if (s < 5) return 'just now';
    if (s < 60) return `${s}s ago`;
    return `${Math.round(s / 60)}m ago`;
  };

  // ---- synthetic transaction + fraud-rule engine (mirrors backend/src/services) ----
  const MERCHANTS = ['Ramen Ichiban', 'Tokyo Metro', 'ConbiniMart', 'CloudHost Inc', 'FreshGrocer', 'StreamPlus'];
  const USERS = Array.from({ length: 30 }, (_, i) => `usr_${1000 + i}`);

  function scoreRisk(candidate, recentHistory) {
    let score = 5;
    const large = candidate.amountMinor > 300_000;
    const velocity =
      recentHistory.filter((t) => t.userId === candidate.userId && candidate.timestamp - t.timestamp <= 60_000)
        .length >= 3;
    if (large) score += 55;
    if (velocity) score += 45;
    return { riskScore: Math.min(score, 100), flagged: large || velocity };
  }

  function makeTransaction(recentHistory) {
    const userId = USERS[Math.floor(Math.random() * USERS.length)];
    const now = Date.now();
    const amountMinor =
      Math.random() < 0.035 ? 300_000 + Math.floor(Math.random() * 700_000) : 300 + Math.floor(Math.random() * 15_000);
    const { riskScore, flagged } = scoreRisk({ userId, timestamp: now, amountMinor }, recentHistory);
    const failed = !flagged && Math.random() < 0.02;
    return {
      id: 'tx_' + Math.random().toString(36).slice(2, 10),
      timestamp: now,
      userId,
      merchant: MERCHANTS[Math.floor(Math.random() * MERCHANTS.length)],
      amountMinor,
      status: flagged ? 'flagged' : failed ? 'failed' : 'completed',
      riskScore,
      latencyMs: 40 + Math.floor(Math.random() * 260),
    };
  }

  // ---- a real Web Worker, built from a Blob so this stays a single file ----
  const WORKER_SRC = `
    const buckets = new Map();
    const BUCKET_MS = 5000, WINDOW_MS = 5*60000;
    function key(t){ return Math.floor(t/BUCKET_MS)*BUCKET_MS; }
    self.onmessage = (e) => {
      const tx = e.data;
      const k = key(tx.timestamp);
      const b = buckets.get(k) || { bucketStart: k, count: 0, volumeMinor: 0 };
      b.count += 1; b.volumeMinor += tx.amountMinor;
      buckets.set(k, b);
      const cutoff = Date.now() - WINDOW_MS;
      for (const kk of buckets.keys()) if (kk < cutoff) buckets.delete(kk);
      const arr = [...buckets.values()].sort((a,b)=>a.bucketStart-b.bucketStart);
      self.postMessage(arr);
    };
  `;

  function useVolumeBuckets() {
    const [buckets, setBuckets] = useState([]);
    const workerRef = useRef(null);
    useEffect(() => {
      const blob = new Blob([WORKER_SRC], { type: 'application/javascript' });
      const worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = (e) => setBuckets(e.data);
      workerRef.current = worker;
      return () => worker.terminate();
    }, []);
    const push = useCallback((tx) => workerRef.current?.postMessage(tx), []);
    return { buckets, push };
  }

  // ---- real Web Vitals for THIS page, via the actual web-vitals library ----
  function useWebVitals() {
    const [vitals, setVitals] = useState({});
    useEffect(() => {
      if (!window.webVitals) return;
      const upd = (key) => (m) => setVitals((prev) => ({ ...prev, [key]: { value: m.value, rating: m.rating } }));
      window.webVitals.onCLS(upd('CLS'));
      window.webVitals.onINP(upd('INP'));
      window.webVitals.onLCP(upd('LCP'));
      window.webVitals.onFCP(upd('FCP'));
      window.webVitals.onTTFB(upd('TTFB'));
    }, []);
    return vitals;
  }

  function useDebounced(value, delay) {
    const [debounced, setDebounced] = useState(value);
    useEffect(() => {
      const t = setTimeout(() => setDebounced(value), delay);
      return () => clearTimeout(t);
    }, [value, delay]);
    return debounced;
  }

  // ---- components ----
  const MetricTile = memo(function MetricTile({ label, value, tone }) {
    return h('div', { className: `tile ${tone || ''}` }, h('span', { className: 'label' }, label), h('span', { className: 'value mono' }, value));
  });

  const VITAL_NAMES = { LCP: 'Largest Contentful Paint', INP: 'Interaction to Next Paint', CLS: 'Cumulative Layout Shift', FCP: 'First Contentful Paint', TTFB: 'Time to First Byte' };

  function WebVitalsPanel({ vitals }) {
    const keys = Object.keys(vitals);
    return h(
      'div',
      { className: 'card' },
      h('div', { className: 'card-head' }, h('h3', null, "This page's Web Vitals"), h('span', { className: 'hint' }, 'measured live, right now')),
      keys.length === 0
        ? h('p', { className: 'hint' }, 'Collecting metrics…')
        : h(
            'ul',
            { className: 'vitals-list' },
            keys.map((k) =>
              h(
                'li',
                { key: k, className: vitals[k].rating },
                h('span', { className: 'k' }, k),
                h('span', { className: 'v mono' }, k === 'CLS' ? vitals[k].value.toFixed(3) : Math.round(vitals[k].value) + 'ms'),
                h('span', { className: 'n' }, VITAL_NAMES[k]),
              ),
            ),
          ),
    );
  }

  function VolumeChart({ buckets }) {
    const [hoverIdx, setHoverIdx] = useState(null);
    const width = 520,
      height = 200,
      padL = 44,
      padB = 22,
      padT = 10;
    const data = buckets.length ? buckets : [{ bucketStart: Date.now(), volumeMinor: 0 }];
    const maxV = Math.max(...data.map((d) => d.volumeMinor), 1000);
    const x = (i) => padL + (i / Math.max(data.length - 1, 1)) * (width - padL - 12);
    const y = (v) => height - padB - (v / maxV) * (height - padB - padT);

    const linePath = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${x(i)} ${y(d.volumeMinor)}`).join(' ');
    const areaPath = `${linePath} L ${x(data.length - 1)} ${height - padB} L ${x(0)} ${height - padB} Z`;

    return h(
      'div',
      { className: 'card' },
      h('div', { className: 'card-head' }, h('h3', null, 'Transaction volume'), h('span', { className: 'hint' }, 'last 5 min, 5s buckets')),
      h(
        'div',
        { style: { position: 'relative' } },
        h(
          'svg',
          {
            viewBox: `0 0 ${width} ${height}`,
            preserveAspectRatio: 'none',
            width: '100%',
            height: 220,
            onMouseMove: (e) => {
              const rect = e.currentTarget.getBoundingClientRect();
              const relX = ((e.clientX - rect.left) / rect.width) * width;
              let closest = 0,
                best = Infinity;
              data.forEach((d, i) => {
                const dist = Math.abs(x(i) - relX);
                if (dist < best) {
                  best = dist;
                  closest = i;
                }
              });
              setHoverIdx(closest);
            },
            onMouseLeave: () => setHoverIdx(null),
          },
          [0.25, 0.5, 0.75, 1].map((f) =>
            h('line', {
              key: f,
              x1: padL,
              x2: width - 12,
              y1: padT + (height - padB - padT) * (1 - f),
              y2: padT + (height - padB - padT) * (1 - f),
              stroke: 'var(--chart-grid)',
              strokeDasharray: '3 4',
              vectorEffect: 'non-scaling-stroke',
            }),
          ),
          h('text', { x: 4, y: y(maxV) + 4, fontSize: 10, fill: 'var(--chart-axis)' }, formatCompactYen(maxV)),
          h('text', { x: 4, y: height - padB, fontSize: 10, fill: 'var(--chart-axis)' }, '¥0'),
          h(
            'defs',
            null,
            h(
              'linearGradient',
              { id: 'volFill', x1: 0, y1: 0, x2: 0, y2: 1 },
              h('stop', { offset: '0%', stopColor: 'var(--accent)', stopOpacity: 0.32 }),
              h('stop', { offset: '100%', stopColor: 'var(--accent)', stopOpacity: 0 }),
            ),
          ),
          h('path', { d: areaPath, fill: 'url(#volFill)' }),
          h('path', { d: linePath, fill: 'none', stroke: 'var(--accent)', strokeWidth: 2, vectorEffect: 'non-scaling-stroke' }),
          data.length > 0 &&
            h('circle', { cx: x(data.length - 1), cy: y(data[data.length - 1].volumeMinor), r: 4, fill: 'var(--accent)' }),
          hoverIdx !== null &&
            h('line', {
              x1: x(hoverIdx),
              x2: x(hoverIdx),
              y1: padT,
              y2: height - padB,
              stroke: 'var(--chart-axis)',
              strokeDasharray: '2 3',
              vectorEffect: 'non-scaling-stroke',
            }),
          hoverIdx !== null && h('circle', { cx: x(hoverIdx), cy: y(data[hoverIdx].volumeMinor), r: 4, fill: 'var(--accent)' }),
        ),
        hoverIdx !== null &&
          h(
            'div',
            {
              className: 'chart-tooltip',
              style: { left: `${(x(hoverIdx) / width) * 100}%`, top: `${(y(data[hoverIdx].volumeMinor) / height) * 100}%` },
            },
            formatCompactYen(data[hoverIdx].volumeMinor),
          ),
      ),
    );
  }

  const Row = memo(function Row({ tx }) {
    return h(
      'div',
      { className: 'row' },
      h('span', { className: 'cell' }, formatRelative(tx.timestamp)),
      h('span', { className: 'cell' }, tx.merchant),
      h('span', { className: 'cell mono' }, tx.userId),
      h('span', { className: 'cell mono' }, formatYen(tx.amountMinor)),
      h('span', { className: `status ${tx.status}` }, tx.status),
      h('span', { className: 'cell mono' }, tx.latencyMs + 'ms'),
    );
  });

  function VirtualTable({ items }) {
    const [scrollTop, setScrollTop] = useState(0);
    const rowHeight = 40,
      viewportHeight = 360,
      overscan = 4;
    const start = Math.max(0, Math.floor(scrollTop / rowHeight) - overscan);
    const visibleCount = Math.ceil(viewportHeight / rowHeight);
    const end = Math.min(items.length, start + visibleCount + overscan * 2);
    const visible = items.slice(start, end);

    return h(
      'div',
      null,
      h(
        'div',
        { className: 'metric-strip' },
        h('span', null, 'Total rows: ', h('strong', null, items.length.toLocaleString())),
        h('span', null, 'DOM rows rendered: ', h('strong', null, visible.length)),
      ),
      h(
        'div',
        { className: 'row head' },
        h('span', null, 'Time'),
        h('span', null, 'Merchant'),
        h('span', null, 'User'),
        h('span', null, 'Amount'),
        h('span', null, 'Status'),
        h('span', null, 'Latency'),
      ),
      h(
        'div',
        { className: 'viewport', onScroll: (e) => setScrollTop(e.target.scrollTop) },
        h('div', { style: { height: start * rowHeight } }),
        visible.map((tx) => h(Row, { key: tx.id, tx })),
        h('div', { style: { height: (items.length - end) * rowHeight } }),
      ),
    );
  }

  function FilterBar({ onChange }) {
    const [search, setSearch] = useState('');
    const [status, setStatus] = useState('all');
    const debounced = useDebounced(search, 300);
    useEffect(() => onChange({ search: debounced, status }), [debounced, status]);
    return h(
      'div',
      { className: 'filter-row' },
      h('input', { placeholder: 'Search user or merchant…', value: search, onChange: (e) => setSearch(e.target.value) }),
      ['all', 'completed', 'flagged', 'failed'].map((s) =>
        h('button', { key: s, className: `chip ${status === s ? 'active' : ''}`, onClick: () => setStatus(s) }, s),
      ),
    );
  }

  function App() {
    const [items, setItems] = useState([]);
    const [metrics, setMetrics] = useState(null);
    const [flagged, setFlagged] = useState(null);
    const [filter, setFilter] = useState({ search: '', status: 'all' });
    const [connState, setConnState] = useState('open');
    const { buckets, push } = useVolumeBuckets();
    const vitals = useWebVitals();
    const historyRef = useRef([]);
    const pausedRef = useRef(false);

    useEffect(() => {
      const timer = setInterval(() => {
        if (pausedRef.current) return;
        const tx = makeTransaction(historyRef.current.filter((t) => Date.now() - t.timestamp < 60_000));
        historyRef.current = [...historyRef.current, tx].slice(-500);
        setItems((prev) => [tx, ...prev].slice(0, 2000));
        if (tx.status === 'flagged') setFlagged(tx);
        push(tx);
      }, 200);
      return () => clearInterval(timer);
    }, [push]);

    useEffect(() => {
      const timer = setInterval(() => {
        const windowTx = historyRef.current.filter((t) => Date.now() - t.timestamp < 60_000);
        const latencies = windowTx.map((t) => t.latencyMs).sort((a, b) => a - b);
        setMetrics({
          count: windowTx.length,
          volumeMinor: windowTx.reduce((s, t) => s + t.amountMinor, 0),
          flaggedCount: windowTx.filter((t) => t.status === 'flagged').length,
          failedCount: windowTx.filter((t) => t.status === 'failed').length,
          avgLatencyMs: latencies.length ? Math.round(latencies.reduce((a, b) => a + b, 0) / latencies.length) : 0,
          p95LatencyMs: latencies.length ? latencies[Math.max(0, Math.ceil(latencies.length * 0.95) - 1)] : 0,
        });
      }, 1000);
      return () => clearInterval(timer);
    }, []);

    useEffect(() => {
      if (!flagged) return;
      const t = setTimeout(() => setFlagged(null), 8000);
      return () => clearTimeout(t);
    }, [flagged]);

    function simulateDrop() {
      pausedRef.current = true;
      setConnState('closed');
      setTimeout(() => setConnState('connecting'), 900);
      setTimeout(() => {
        pausedRef.current = false;
        setConnState('open');
      }, 2200);
    }

    const filtered = useMemo(
      () =>
        items.filter((tx) => {
          if (filter.status !== 'all' && tx.status !== filter.status) return false;
          if (!filter.search) return true;
          const q = filter.search.toLowerCase();
          return tx.userId.toLowerCase().includes(q) || tx.merchant.toLowerCase().includes(q);
        }),
      [items, filter],
    );

    return h(
      'div',
      { className: 'page' },
      h(
        'div',
        { className: 'top' },
        h('div', null, h('h1', null, 'PulseBoard'), h('p', { className: 'tagline' }, 'Live transaction monitoring — an interactive front-end demo.')),
        h(
          'div',
          { className: 'top-right' },
          h('span', { className: 'badge' }, 'React 18'),
          h('span', { className: 'badge' }, 'Express + WS backend (in source)'),
          h(
            'span',
            { className: `pill ${connState === 'open' ? 'live' : 'down'}` },
            h('span', { className: 'dot' }),
            connState === 'open' ? 'Live' : connState === 'connecting' ? 'Reconnecting…' : 'Disconnected',
          ),
          h('button', { className: 'link-btn', onClick: simulateDrop }, 'Simulate connection drop'),
        ),
      ),

      flagged &&
        h(
          'div',
          { className: 'banner', role: 'alert' },
          '⚠ Flagged: ',
          h('strong', null, formatYen(flagged.amountMinor)),
          ' from ',
          h('span', { className: 'mono' }, flagged.userId),
          ' at ',
          flagged.merchant,
          ' — risk ',
          h('strong', null, flagged.riskScore),
          h('button', { onClick: () => setFlagged(null), 'aria-label': 'Dismiss' }, '×'),
        ),

      h(
        'div',
        { className: 'metric-grid' },
        h(MetricTile, { label: 'Txns / min', value: metrics ? String(metrics.count) : '—' }),
        h(MetricTile, { label: 'Volume', value: metrics ? formatCompactYen(metrics.volumeMinor) : '—' }),
        h(MetricTile, { label: 'Flagged', value: metrics ? String(metrics.flaggedCount) : '—', tone: metrics && metrics.flaggedCount ? 'warning' : 'good' }),
        h(MetricTile, { label: 'Failed', value: metrics ? String(metrics.failedCount) : '—', tone: metrics && metrics.failedCount ? 'critical' : 'good' }),
        h(MetricTile, { label: 'Avg latency', value: metrics ? metrics.avgLatencyMs + 'ms' : '—' }),
        h(MetricTile, { label: 'p95 latency', value: metrics ? metrics.p95LatencyMs + 'ms' : '—' }),
      ),

      h('div', { className: 'panel-grid' }, h(VolumeChart, { buckets }), h(WebVitalsPanel, { vitals })),

      h(
        'div',
        { className: 'table-card' },
        h(FilterBar, { onChange: setFilter }),
        h(VirtualTable, { items: filtered }),
      ),

      h(
        'div',
        { className: 'notes' },
        h(
          'div',
          { className: 'card' },
          h('span', { className: 'eyebrow' }, 'Performance'),
          h(
            'p',
            null,
            'The table above only ever mounts the rows in view (watch "DOM rows rendered" stay flat as the feed grows). Volume aggregation runs in a real Web Worker, built from a Blob so it stays in this one file — open devtools → Sources → Workers to see it running.',
          ),
        ),
        h(
          'div',
          { className: 'card' },
          h('span', { className: 'eyebrow' }, 'Resilience'),
          h(
            'p',
            null,
            '"Simulate connection drop" pauses the feed and walks the connection pill through the same connecting → reconnecting → live states the real useLiveFeed hook produces on an actual dropped WebSocket, backoff included.',
          ),
        ),
        h(
          'div',
          { className: 'card' },
          h('span', { className: 'eyebrow' }, 'Monitoring, for real') ,
          h(
            'p',
            null,
            "The Web Vitals panel isn't simulated — it's the actual web-vitals library measuring this page, in your browser, right now. That's the same signal a New Relic Browser or Sentry Performance integration reports.",
          ),
        ),
      ),

      h('footer', { className: 'note' }, 'PulseBoard — portfolio demo. Transaction data is synthetic and regenerates on reload.'),
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(h(App));
</script>

</body>
</html>
